<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upscale batch — before / after</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#0a0b0e;--surf:#141619;--surf2:#1c1f24;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.15);--ink:#f5f7fa;--mut:#8b90a0;--faint:#5a5f6e;--acc:#c6f24e;--acc-ink:#0a0b0e;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink);padding:calc(env(safe-area-inset-top) + 20px) 14px 60px;max-width:520px;margin:0 auto}
.h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.sub{font-size:13px;color:var(--mut);margin:5px 0 20px;line-height:1.4}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.cn{font-size:15px;font-weight:700;padding:12px 14px 4px;text-transform:capitalize}
.cm{font-size:11px;color:var(--mut);padding:0 14px 12px;text-transform:capitalize}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.side{background:#fff;position:relative;aspect-ratio:1;overflow:hidden}
.side img{width:100%;height:100%;object-fit:contain;image-rendering:auto}
.side.orig img{image-rendering:pixelated}
.tag{position:absolute;top:8px;left:8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:20px}
.tag.o{background:#e5484d;color:#fff}.tag.u{background:var(--acc);color:var(--acc-ink)}
.note{font-size:11px;color:var(--faint);text-align:center;margin-top:24px;line-height:1.5}
</style></head>
<body>
  <div class="h1">Upscale batch · before / after</div>
  <div class="sub">Left = original 180px (from exercisedb). Right = Real-ESRGAN 4× → 720px. Both shown at the same size so you can compare sharpness. Gifs animate.</div>
  <div id="grid"></div>
  <div class="note">6-exercise sample · upscaled free & locally on the M4.<br>If this looks good we batch all 1500 and host them in the app.</div>
<script>
const items=[
 {f:'01qpYSe.gif',n:'Upward Facing Dog',m:'Body weight · Spine'},
 {f:'0CXGHya.gif',n:'Cable Cross-Over',m:'Cable · Pectorals'},
 {f:'03lzqwk.gif',n:'Assisted Hanging Knee Raise',m:'Assisted · Abs'},
 {f:'05Cf2v8.gif',n:'Impossible Dips',m:'Body weight · Triceps'},
 {f:'0br45wL.gif',n:'Push-Up Inside Leg Kick',m:'Body weight · Glutes'},
 {f:'0dCyly0.gif',n:'Barbell Seated Bradford Press',m:'Barbell · Delts'},
];
document.getElementById('grid').innerHTML = items.map(it=>`
 <div class="card">
   <div class="cn">${it.n}</div><div class="cm">${it.m}</div>
   <div class="pair">
     <div class="side orig"><span class="tag o">Original 180px</span><img src="./orig/${it.f}"></div>
     <div class="side"><span class="tag u">Upscaled 720px</span><img src="./up/${it.f}"></div>
   </div>
 </div>`).join('');
</script>
</body></html>
